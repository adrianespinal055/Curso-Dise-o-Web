<!DOCTYPE html>

    <title>Inputs</title>

<body>
    <form action="">

        <input type="email" name="correo" placeholder="correo@correo.com">
        <br>
        <!--Password-->     
        <input type="password" name="contrasena" id="contrasena" placeholder="Escribe tu clave">
        <br>
        <!--Campo tipo numero-->

        <!--Campo de Selecion-->
