<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <!--Filas y columnas
    thead = Indica que es el header de la tabla para darle semantica
    tbody = Indica que es el cuerpo de la tabla para darle semantica
    th = el texto se sentra y se pone en negrita 
    tfoot = Es el pie de la pagina

    table-Define una tabla
    tr-table row - Filas
    td - table data / Informacion
    th - table heading / encabezado

    Etiquetas semanticas,le sirven al navegador y buscadores 
    thead = Encabezado de una tabla
    tbody = Cuerpo de una tabla 
    tfoot = Pie de pagina de una tabla 
    -->

    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Telefono</th>
            <th>Direccion</th>
        </tr>
        </thead>
        <tbody>
            <tr>
            <td>Carlos Arturo</td>
            <td>829-392-4555</td>
            <td>lorem ipsum door</td>
        </tr>
        <tr>
            <td>Carlos Arturo</td>
            <td>829-392-4555</td>
            <td>lorem ipsum door</td>
        </tr>
        <tr>
            <td>Carlos Arturo</td>
            <td>829-392-4555</td>
            <td>lorem ipsum door</td>
        </tr>
        </tbody>
        <tfoot>
            
        </tfoot>

    </table>
</body>
</html>
